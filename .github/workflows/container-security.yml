name: Container Security

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - ".gitignore"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: container-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Docker Scan & SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -f MotoSOS.API/Dockerfile -t motosos-api:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: motosos-api:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: motosos-api:ci
          format: spdx-json
          output-file: motosos-api-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: motosos-api-sbom
          path: motosos-api-sbom.spdx.json
          if-no-files-found: error

      - name: Fail on high or critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: motosos-api:ci
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"
